<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Art Gallery Bingo</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Art Bingo">

<link rel="apple-touch-icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAYAAACqaXHeAAAACXBIWXMAAAsTAAALEwEAmpwYAAAAKElEQVR4nO3BAQ0AAADCoPdPbQ8HFAAAAAAAAAAAAAAAAAAAwM8FhQAAAWgD4QAAAABJRU5ErkJggg==">

<link rel="manifest" href="data:application/json,{
  &quot;name&quot;:&quot;Art Gallery Bingo&quot;,
  &quot;short_name&quot;:&quot;Art Bingo&quot;,
  &quot;display&quot;:&quot;standalone&quot;,
  &quot;background_color&quot;:&quot;#ffffff&quot;,
  &quot;theme_color&quot;:&quot;#ffffff&quot;
}">

<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    margin: 0;
    padding: 20px;
    background: #ffffff;
  }

  h1, h2 {
    text-align: center;
    font-weight: 600;
  }

  .setup {
    max-width: 500px;
    margin: 0 auto 30px;
  }

  label {
    display: block;
    margin-top: 15px;
    font-weight: 500;
  }

  input {
    width: 100%;
    padding: 8px;
    margin-top: 5px;
    font-size: 16px;
  }

  button {
    margin-top: 20px;
    width: 100%;
    padding: 12px;
    font-size: 16px;
    background: #000;
    color: #fff;
    border: none;
    border-radius: 6px;
  }

  .card {
    margin: 40px auto;
    max-width: 900px;
  }

  table {
    border-collapse: collapse;
    width: 100%;
  }

  td {
    border: 1px solid #444;
    width: 20%;
    height: 70px;
    text-align: center;
    vertical-align: middle;
    padding: 6px;
    font-size: 14px;
    cursor: pointer;
    user-select: none;
  }

  td.checked {
    background-color: #9ad96f;
    text-decoration: line-through;
    font-weight: 500;
  }

  td.free {
    background-color: #f4c430;
    font-weight: 700;
    cursor: default;
  }

  @media (max-width: 600px) {
    td {
      height: 60px;
      font-size: 12px;
    }
  }
</style>
</head>

<body>

<h1>🎨 Art Gallery Bingo</h1>

<div class="setup" id="setup">
  <label>Number of Players</label>
  <input type="number" id="playerCount" min="1" max="10" value="2">
  <div id="playerNames"></div>
  <button onclick="startGame()">Generate Cards</button>
</div>

<div id="cards"></div>

<script>
const STORAGE_KEY = "art-gallery-bingo";

const SUBJECTS = [
  "Christian Religious Symbols","Mountains","Starry Nights","Body of Water",
  "Naked People","Horned/Antlered Animals","Penguin(s)","Horse(s)","Fruit","Rain",
  "Alien","Children","Bird","Beverage","Car","Rainbow","Plants",
  "Residential Building","Fire","Dog","Cat","Romance","Shoes",
  "Something Spilled","Flag","Obvious Triangle"
];

function shuffle(arr) {
  return [...arr].sort(() => Math.random() - 0.5);
}

function saveState(state) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function loadState() {
  const raw = localStorage.getItem(STORAGE_KEY);
  return raw ? JSON.parse(raw) : null;
}

function toggleCell(cell, stateRef) {
  if (cell.classList.contains("free")) return;
  cell.classList.toggle("checked");
  stateRef.checked = cell.classList.contains("checked");
  saveState(appState);
}

function buildNameInputs(count) {
  const container = document.getElementById("playerNames");
  container.innerHTML = "";
  for (let i = 0; i < count; i++) {
    const label = document.createElement("label");
    label.textContent = `Player ${i + 1} Name`;
    const input = document.createElement("input");
    input.id = `player-${i}`;
    input.placeholder = `Player ${i + 1}`;
    container.appendChild(label);
    container.appendChild(input);
  }
}

document.getElementById("playerCount").addEventListener("change", e => {
  buildNameInputs(Number(e.target.value));
});

let appState = loadState();

function startGame() {
  const count = Number(document.getElementById("playerCount").value);
  appState = { players: [] };

  for (let i = 0; i < count; i++) {
    const name = document.getElementById(`player-${i}`).value || `Player ${i + 1}`;
    const items = shuffle(SUBJECTS).slice(0, 24).map(text => ({
      text,
      checked: false
    }));
    appState.players.push({ name, items });
  }

  saveState(appState);
  render();
}

function render() {
  document.getElementById("setup").style.display = "none";
  const container = document.getElementById("cards");
  container.innerHTML = "";

  appState.players.forEach(player => {
    const card = document.createElement("div");
    card.className = "card";

    const title = document.createElement("h2");
    title.textContent = player.name;
    card.appendChild(title);

    const table = document.createElement("table");
    let index = 0;

    for (let r = 0; r < 5; r++) {
      const row = document.createElement("tr");
      for (let c = 0; c < 5; c++) {
        const cell = document.createElement("td");

        if (r === 2 && c === 2) {
          cell.textContent = "FREE SPACE";
          cell.className = "free";
        } else {
          const ref = player.items[index];
          cell.textContent = ref.text;
          if (ref.checked) cell.classList.add("checked");
          cell.onclick = () => toggleCell(cell, ref);
          index++;
        }

        row.appendChild(cell);
      }
      table.appendChild(row);
    }

    card.appendChild(table);
    container.appendChild(card);
  });
}

(function init() {
  if (appState) {
    render();
  } else {
    buildNameInputs(Number(document.getElementById("playerCount").value));
  }
})();
</script>

</body>
</html>
